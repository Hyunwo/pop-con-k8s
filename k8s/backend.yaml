apiVersion: apps/v1
kind: Deployment
metadata:
  name: popcon-backend
  namespace: popcon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: popcon-backend
  template:
    metadata:
      labels:
        app: popcon-backend
    spec:
      imagePullSecrets:
        - name: ecr-secret        # ECR 인증 (default 네임스페이스에 생성한 secret)
      containers:
        - name: backend
          image: 654654578161.dkr.ecr.ap-northeast-2.amazonaws.com/dev-app:backend-latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: popcon-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: popcon-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: popcon-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: popcon-secret
                  key: DB_NAME
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: popcon-backend
  namespace: popcon
spec:
  selector:
    app: popcon-backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort